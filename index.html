<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON DRIFT - Synthwave Space Shooter</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #05010d; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    touch-action: none;
    background: #0a0420;
    box-shadow: 0 0 40px rgba(255, 46, 151, 0.35), 0 0 80px rgba(0, 240, 255, 0.15);
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
(() => {
  'use strict';

  // ---------- Setup ----------
  const W = 800, H = 600;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    canvas.style.width = Math.floor(W * s) + 'px';
    canvas.style.height = Math.floor(H * s) + 'px';
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  const COL = {
    pink: '#ff2e97', cyan: '#00f0ff', purple: '#9d4dff',
    yellow: '#ffe66d', white: '#ffffff', deep: '#0a0420'
  };

  // ---------- State machine ----------
  const STATE = { START_MENU: 'START_MENU', PLAYING: 'PLAYING', GAME_OVER: 'GAME_OVER' };
  let state = STATE.START_MENU;
  let stateTime = 0;

  function setState(s) {
    state = s;
    stateTime = 0;
    if (s === STATE.PLAYING) resetGame();
    if (s === STATE.GAME_OVER) onGameOver();
  }

  // ---------- Persistent high score ----------
  const HS_KEY = 'neonDriftHighScore';
  function loadHS() { try { return parseInt(localStorage.getItem(HS_KEY), 10) || 0; } catch (e) { return 0; } }
  function saveHS(v) { try { localStorage.setItem(HS_KEY, String(v)); } catch (e) {} }
  let highScore = loadHS();
  let newRecord = false;

  // ---------- Input ----------
  const keys = {};
  const pointer = { x: W / 2, y: H - 100, down: false, type: 'mouse', hover: false, inside: false };

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
    if (!keys[k] && (k === 'enter' || k === ' ')) {
      if (state === STATE.START_MENU) setState(STATE.PLAYING);
      else if (state === STATE.GAME_OVER && stateTime > 0.6) setState(STATE.PLAYING);
    }
    keys[k] = true;
  });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointer.down = false; });

  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
  }

  const btn = { w: 280, h: 64 };
  function btnRect() {
    const y = state === STATE.START_MENU ? 440 : 450;
    return { x: W / 2 - btn.w / 2, y: y, w: btn.w, h: btn.h };
  }
  function inBtn(p) {
    const b = btnRect();
    return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
  }

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const p = toLogical(e);
    pointer.x = p.x; pointer.y = p.y; pointer.down = true; pointer.type = e.pointerType;
    if (state === STATE.START_MENU && inBtn(p)) setState(STATE.PLAYING);
    else if (state === STATE.GAME_OVER && stateTime > 0.6 && inBtn(p)) setState(STATE.PLAYING);
  });
  canvas.addEventListener('pointermove', e => {
    const p = toLogical(e);
    pointer.x = p.x; pointer.y = p.y; pointer.type = e.pointerType;
    pointer.hover = (state !== STATE.PLAYING) && inBtn(p);
  });
  const release = e => { pointer.down = false; };
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- Game objects ----------
  let ship, bullets, asteroids, particles, stars, score, lives, gameTime, spawnTimer, level, shake, shootTimer, bgTime;
  const popups = [];

  function makeStars() {
    stars = [];
    for (let i = 0; i < 90; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        z: Math.random() * 0.8 + 0.2,
        tw: Math.random() * Math.PI * 2
      });
    }
  }

  function resetGame() {
    ship = { x: W / 2, y: H - 90, vx: 0, vy: 0, r: 13, invuln: 2.0, alive: true };
    bullets = []; asteroids = []; particles = []; popups.length = 0;
    score = 0; lives = 3; gameTime = 0; spawnTimer = 0.6; level = 0;
    shake = 0; shootTimer = 0; newRecord = false;
    pointer.x = ship.x; pointer.y = ship.y;
  }

  makeStars();
  bgTime = 0;
  resetGame();
  // seed menu asteroids for ambience
  function seedMenuAsteroids() {
    asteroids = [];
    for (let i = 0; i < 6; i++) {
      const a = spawnAsteroid(1, [44, 28, 16][i % 3]);
      a.y = Math.random() * H;
    }
  }
  seedMenuAsteroids();

  function spawnAsteroid(speedMul, forcedR, x, y) {
    const sizes = [16, 28, 44];
    let r = forcedR;
    if (!r) {
      const roll = Math.random();
      const bigChance = Math.min(0.15 + level * 0.04, 0.4);
      r = roll < bigChance ? 44 : roll < 0.6 ? 28 : 16;
    }
    const n = 9 + Math.floor(Math.random() * 3);
    const verts = [];
    for (let i = 0; i < n; i++) {
      const ang = (i / n) * Math.PI * 2;
      verts.push({ a: ang, d: 0.72 + Math.random() * 0.4 });
    }
    const baseSpeed = 70 + Math.random() * 60;
    const a = {
      x: x !== undefined ? x : Math.random() * (W - 80) + 40,
      y: y !== undefined ? y : -r - 10,
      vx: (Math.random() - 0.5) * (60 + level * 8),
      vy: (baseSpeed + (44 - r) * 1.2) * speedMul,
      r: r, rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 2.5,
      hp: r >= 44 ? 3 : r >= 28 ? 2 : 1,
      verts: verts, flash: 0,
      hue: Math.random() < 0.5 ? COL.pink : COL.purple
    };
    asteroids.push(a);
    return a;
  }

  function burst(x, y, count, colors, speed, life) {
    for (let i = 0; i < count; i++) {
      if (particles.length > 700) particles.shift();
      const a = Math.random() * Math.PI * 2;
      const s = Math.random() * speed + speed * 0.2;
      particles.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: life * (0.5 + Math.random() * 0.7), max: life,
        size: 1.5 + Math.random() * 2.5,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  function addPopup(x, y, text, color) {
    popups.push({ x: x, y: y, text: text, life: 0.9, color: color });
  }

  // ---------- Update ----------
  function updateBackground(dt) {
    bgTime += dt;
    for (const s of stars) {
      s.y += s.z * 60 * dt * (1 + level * 0.05);
      if (s.y > H) { s.y = -2; s.x = Math.random() * W; }
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.985; p.vy *= 0.985;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      popups[i].y -= 30 * dt;
      popups[i].life -= dt;
      if (popups[i].life <= 0) popups.splice(i, 1);
    }
  }

  function updateMenu(dt) {
    updateBackground(dt);
    for (const a of asteroids) {
      a.x += a.vx * dt * 0.5; a.y += a.vy * dt * 0.5; a.rot += a.vr * dt;
      if (a.y > H + 60) { a.y = -60; a.x = Math.random() * W; }
      if (a.x < -60) a.x = W + 60;
      if (a.x > W + 60) a.x = -60;
    }
  }

  function updatePlaying(dt) {
    gameTime += dt;
    level = Math.floor(gameTime / 15);
    const speedMul = 1 + level * 0.12;
    updateBackground(dt);

    // --- ship movement ---
    const accel = 2600, maxSpeed = 360;
    let ix = 0, iy = 0;
    if (keys['a'] || keys['arrowleft']) ix -= 1;
    if (keys['d'] || keys['arrowright']) ix += 1;
    if (keys['w'] || keys['arrowup']) iy -= 1;
    if (keys['s'] || keys['arrowdown']) iy += 1;
    const usingKeys = ix !== 0 || iy !== 0;

    if (usingKeys) {
      const len = Math.hypot(ix, iy);
      ship.vx += (ix / len) * accel * dt;
      ship.vy += (iy / len) * accel * dt;
    } else if (pointer.down) {
      const ty = pointer.y - (pointer.type === 'touch' ? 55 : 0);
      const tx = pointer.x;
      const k = 14;
      ship.vx = (tx - ship.x) * k;
      ship.vy = (ty - ship.y) * k;
    }
    const damp = usingKeys ? 0.9 : (pointer.down ? 1 : 0.86);
    ship.vx *= Math.pow(damp, dt * 60);
    ship.vy *= Math.pow(damp, dt * 60);
    const sp = Math.hypot(ship.vx, ship.vy);
    const cap = pointer.down && !usingKeys ? 1400 : maxSpeed;
    if (sp > cap) { ship.vx *= cap / sp; ship.vy *= cap / sp; }
    ship.x += ship.vx * dt; ship.y += ship.vy * dt;
    ship.x = Math.max(ship.r, Math.min(W - ship.r, ship.x));
    ship.y = Math.max(ship.r + 40, Math.min(H - ship.r, ship.y));
    if (ship.invuln > 0) ship.invuln -= dt;

    // engine trail
    if (Math.random() < 0.8) {
      particles.push({
        x: ship.x + (Math.random() - 0.5) * 6, y: ship.y + 12,
        vx: (Math.random() - 0.5) * 20 - ship.vx * 0.1, vy: 120 + Math.random() * 80,
        life: 0.3, max: 0.3, size: 2 + Math.random() * 2,
        color: Math.random() < 0.5 ? COL.cyan : COL.pink
      });
    }

    // --- shooting ---
    shootTimer -= dt;
    const wantShoot = keys[' '] || keys['spacebar'] || pointer.down;
    if (wantShoot && shootTimer <= 0) {
      shootTimer = Math.max(0.1, 0.19 - level * 0.004);
      if (level >= 3) {
        bullets.push({ x: ship.x - 9, y: ship.y - 8, vx: -20, vy: -720 });
        bullets.push({ x: ship.x + 9, y: ship.y - 8, vx: 20, vy: -720 });
      } else {
        bullets.push({ x: ship.x, y: ship.y - 14, vx: 0, vy: -720 });
      }
      if (level >= 6) bullets.push({ x: ship.x, y: ship.y - 14, vx: 0, vy: -760 });
    }
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
    }

    // --- spawning ---
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnAsteroid(speedMul);
      spawnTimer = Math.max(0.28, (0.95 - level * 0.09)) * (0.7 + Math.random() * 0.6);
    }

    // --- asteroids ---
    for (let i = asteroids.length - 1; i >= 0; i--) {
      const a = asteroids[i];
      a.x += a.vx * dt; a.y += a.vy * dt; a.rot += a.vr * dt;
      if (a.flash > 0) a.flash -= dt;
      if (a.x < a.r) { a.x = a.r; a.vx = Math.abs(a.vx); }
      if (a.x > W - a.r) { a.x = W - a.r; a.vx = -Math.abs(a.vx); }
      if (a.y > H + a.r + 20) { asteroids.splice(i, 1); continue; }

      // bullet collisions
      let destroyed = false;
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        if (dx * dx + dy * dy < (a.r * 0.9) * (a.r * 0.9)) {
          bullets.splice(j, 1);
          a.hp--; a.flash = 0.08;
          burst(b.x, b.y, 5, [COL.cyan, COL.white], 140, 0.35);
          shake = Math.max(shake, 2);
          if (a.hp <= 0) { destroyed = true; break; }
        }
      }
      if (destroyed) {
        const pts = a.r >= 44 ? 30 : a.r >= 28 ? 20 : 10;
        score += pts;
        addPopup(a.x, a.y, '+' + pts, COL.yellow);
        burst(a.x, a.y, 14 + Math.floor(a.r / 2), [a.hue, COL.cyan, COL.yellow, COL.white], 260, 0.8);
        shake = Math.max(shake, a.r >= 44 ? 10 : a.r >= 28 ? 6 : 3.5);
        if (a.r > 16) {
          const nr = a.r >= 44 ? 28 : 16;
          for (let k = 0; k < 2; k++) {
            const c = spawnAsteroid(speedMul, nr, a.x, a.y);
            c.vx = (k === 0 ? -1 : 1) * (60 + Math.random() * 60);
            c.vy = a.vy * 0.8;
          }
        }
        asteroids.splice(i, 1);
        continue;
      }

      // ship collision
      if (ship.alive && ship.invuln <= 0) {
        const dx = ship.x - a.x, dy = ship.y - a.y;
        const rr = ship.r + a.r * 0.82;
        if (dx * dx + dy * dy < rr * rr) {
          lives--;
          burst(ship.x, ship.y, 40, [COL.pink, COL.cyan, COL.white, COL.yellow], 380, 1.0);
          burst(a.x, a.y, 14, [a.hue, COL.white], 240, 0.7);
          asteroids.splice(i, 1);
          shake = 22;
          if (lives <= 0) {
            ship.alive = false;
            burst(ship.x, ship.y, 90, [COL.pink, COL.cyan, COL.purple, COL.white], 520, 1.4);
            setState(STATE.GAME_OVER);
            return;
          } else {
            ship.invuln = 2.2;
          }
        }
      }
    }
  }

  function onGameOver() {
    if (score > highScore) { highScore = score; newRecord = true; saveHS(highScore); }
    shake = Math.max(shake, 25);
  }

  function update(dt) {
    stateTime += dt;
    if (state === STATE.START_MENU) {
      updateMenu(dt);
      updateParticles(dt);
    } else if (state === STATE.PLAYING) {
      updatePlaying(dt);
      updateParticles(dt);
    } else if (state === STATE.GAME_OVER) {
      // background is frozen; only let particles finish settling for the death blast
      if (stateTime < 1.6) updateParticles(dt * 0.6);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 45);
  }

  // ---------- Rendering ----------
  function drawBackground() {
    // sky
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#05010d');
    g.addColorStop(0.55, '#1a0638');
    g.addColorStop(1, '#3a0a52');
    ctx.fillStyle = g;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // sun
    const sunY = 400, sunR = 120;
    ctx.save();
    ctx.shadowColor = COL.pink; ctx.shadowBlur = 50;
    const sg = ctx.createLinearGradient(0, sunY - sunR, 0, sunY + sunR);
    sg.addColorStop(0, '#ffe66d');
    sg.addColorStop(0.5, '#ff2e97');
    sg.addColorStop(1, '#7b1fa2');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(W / 2, sunY, sunR, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // sun stripes (cut-outs)
    ctx.fillStyle = '#1a0638';
    for (let i = 0; i < 7; i++) {
      const y = sunY + 10 + i * 17;
      ctx.fillRect(W / 2 - sunR, y, sunR * 2, 2 + i * 1.4);
    }

    // stars
    for (const s of stars) {
      const tw = 0.6 + 0.4 * Math.sin(bgTime * 2 + s.tw);
      ctx.globalAlpha = tw * s.z;
      ctx.fillStyle = s.z > 0.7 ? COL.cyan : COL.white;
      ctx.fillRect(s.x, s.y, s.z * 2, s.z * 2);
    }
    ctx.globalAlpha = 1;

    // perspective grid
    const horizon = 430;
    ctx.fillStyle = 'rgba(10, 4, 32, 0.92)';
    ctx.fillRect(0, horizon, W, H - horizon);
    ctx.save();
    ctx.strokeStyle = COL.pink; ctx.shadowColor = COL.pink; ctx.shadowBlur = 8;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, horizon); ctx.lineTo(W, horizon);
    ctx.stroke();
    ctx.globalAlpha = 0.55;
    const scroll = (bgTime * (0.5 + level * 0.06)) % 1;
    for (let i = 0; i < 12; i++) {
      const t = (i + scroll) / 12;
      const y = horizon + Math.pow(t, 2.2) * (H - horizon);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.strokeStyle = COL.purple; ctx.shadowColor = COL.purple;
    for (let i = -14; i <= 14; i++) {
      ctx.beginPath();
      ctx.moveTo(W / 2 + i * 20, horizon);
      ctx.lineTo(W / 2 + i * 150, H);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawAsteroid(a) {
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(a.rot);
    ctx.shadowColor = a.flash > 0 ? COL.white : a.hue;
    ctx.shadowBlur = 14;
    ctx.beginPath();
    a.verts.forEach((v, i) => {
      const px = Math.cos(v.a) * a.r * v.d, py = Math.sin(v.a) * a.r * v.d;
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    });
    ctx.closePath();
    ctx.fillStyle = a.flash > 0 ? 'rgba(255,255,255,0.85)' : 'rgba(20, 6, 45, 0.85)';
    ctx.fill();
    ctx.strokeStyle = a.flash > 0 ? COL.white : a.hue;
    ctx.lineWidth = 2.2;
    ctx.stroke();
    // inner facets
    ctx.globalAlpha = 0.35; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-a.r * 0.3, -a.r * 0.2); ctx.lineTo(a.r * 0.1, a.r * 0.35); ctx.lineTo(a.r * 0.4, -a.r * 0.15);
    ctx.stroke();
    ctx.restore();
  }

  function drawShip() {
    if (!ship.alive) return;
    if (ship.invuln > 0 && Math.floor(ship.invuln * 12) % 2 === 0) return;
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.shadowColor = COL.cyan; ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(0, -17); ctx.lineTo(13, 13); ctx.lineTo(0, 7); ctx.lineTo(-13, 13);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -17, 0, 13);
    g.addColorStop(0, '#0a2a3a'); g.addColorStop(1, '#2a0a45');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = COL.cyan; ctx.lineWidth = 2.2; ctx.stroke();
    // cockpit
    ctx.shadowColor = COL.pink; ctx.shadowBlur = 10;
    ctx.fillStyle = COL.pink;
    ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(3.5, 3); ctx.lineTo(-3.5, 3); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function drawBullets() {
    ctx.save();
    ctx.shadowColor = COL.cyan; ctx.shadowBlur = 12;
    ctx.strokeStyle = COL.cyan; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (const b of bullets) {
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.02, b.y + 14); ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles() {
    ctx.save();
    for (const p of particles) {
      const t = Math.max(0, p.life / p.max);
      ctx.globalAlpha = t;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 8;
      const s = p.size * (0.4 + t * 0.8);
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.restore();
  }

  function drawPopups() {
    ctx.save();
    ctx.font = 'bold 16px "Courier New", monospace';
    ctx.textAlign = 'center';
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 8;
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.restore();
  }

  function glowText(text, x, y, font, color, glow, align) {
    ctx.save();
    ctx.font = font; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
    ctx.shadowColor = glow || color; ctx.shadowBlur = 16;
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  function drawHUD() {
    glowText('SCORE ' + String(score).padStart(6, '0'), 18, 34, 'bold 22px "Courier New", monospace', COL.cyan);
    glowText('HI ' + String(highScore).padStart(6, '0'), 18, 58, 'bold 14px "Courier New", monospace', COL.purple);
    glowText('LEVEL ' + (level + 1), W - 18, 34, 'bold 18px "Courier New", monospace', COL.yellow, COL.yellow, 'right');
    // lives as ship icons
    for (let i = 0; i < lives; i++) {
      ctx.save();
      ctx.translate(W - 30 - i * 26, 56);
      ctx.shadowColor = COL.pink; ctx.shadowBlur = 8;
      ctx.strokeStyle = COL.pink; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(7, 7); ctx.lineTo(0, 3); ctx.lineTo(-7, 7); ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
    // level-up banner
    const lt = gameTime - level * 15;
    if (level > 0 && lt < 1.8) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, (1.8 - lt) * 1.2);
      glowText('LEVEL ' + (level + 1), W / 2, 150, 'bold 44px "Courier New", monospace', COL.yellow, COL.pink, 'center');
      ctx.restore();
    }
  }

  function drawButton(label) {
    const b = btnRect();
    const hover = pointer.hover;
    const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 280);
    ctx.save();
    ctx.shadowColor = COL.pink; ctx.shadowBlur = 18 + pulse * 18 + (hover ? 12 : 0);
    const g = ctx.createLinearGradient(b.x, b.y, b.x + b.w, b.y + b.h);
    g.addColorStop(0, hover ? '#ff5fb1' : COL.pink);
    g.addColorStop(1, hover ? '#b87aff' : COL.purple);
    ctx.fillStyle = g;
    roundRect(b.x, b.y, b.w, b.h, 14);
    ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = COL.white;
    ctx.shadowColor = COL.cyan;
    ctx.stroke();
    ctx.restore();
    glowText(label, W / 2, b.y + b.h / 2 + 10, 'bold 28px "Courier New", monospace', COL.white, COL.deep, 'center');
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawMenu() {
    // title
    ctx.save();
    ctx.font = 'italic 900 78px "Trebuchet MS", "Arial Black", Impact, sans-serif';
    ctx.textAlign = 'center';
    const tg = ctx.createLinearGradient(0, 90, 0, 170);
    tg.addColorStop(0, COL.cyan); tg.addColorStop(0.5, COL.white); tg.addColorStop(0.55, COL.pink); tg.addColorStop(1, COL.purple);
    ctx.shadowColor = COL.pink; ctx.shadowBlur = 30;
    ctx.fillStyle = tg;
    ctx.fillText('NEON DRIFT', W / 2, 150);
    ctx.shadowColor = COL.cyan; ctx.shadowBlur = 12;
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.strokeText('NEON DRIFT', W / 2, 150);
    ctx.restore();
    glowText('~ SYNTHWAVE SPACE SHOOTER ~', W / 2, 188, 'bold 16px "Courier New", monospace', COL.yellow, COL.pink, 'center');

    // how to play panel
    ctx.save();
    ctx.fillStyle = 'rgba(10, 4, 32, 0.72)';
    ctx.strokeStyle = COL.cyan; ctx.lineWidth = 2; ctx.shadowColor = COL.cyan; ctx.shadowBlur = 12;
    roundRect(W / 2 - 300, 215, 600, 190, 14); ctx.fill(); ctx.stroke();
    ctx.restore();
    const f = 'bold 16px "Courier New", monospace';
    glowText('HOW TO PLAY', W / 2, 245, 'bold 18px "Courier New", monospace', COL.pink, COL.pink, 'center');
    glowText('MOVE   WASD / Arrow Keys  |  Drag finger or mouse', W / 2, 277, f, COL.white, COL.cyan, 'center');
    glowText('FIRE   Spacebar (hold)  |  Auto-fire while touching', W / 2, 303, f, COL.white, COL.cyan, 'center');
    glowText('Destroy asteroids to score. Big ones split apart.', W / 2, 336, f, COL.cyan, COL.cyan, 'center');
    glowText('Dodge the rocks: you have 3 lives. It speeds up every 15s!', W / 2, 362, f, COL.cyan, COL.cyan, 'center');
    glowText('HIGH SCORE  ' + String(highScore).padStart(6, '0'), W / 2, 392, 'bold 16px "Courier New", monospace', COL.yellow, COL.yellow, 'center');

    drawButton('START GAME');
    glowText('or press ENTER', W / 2, 536, '14px "Courier New", monospace', COL.purple, COL.purple, 'center');
  }

  function drawGameOver() {
    ctx.save();
    ctx.fillStyle = 'rgba(5, 1, 13, 0.62)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    glowText('GAME OVER', W / 2, 160, 'italic 900 72px "Trebuchet MS", "Arial Black", Impact, sans-serif', COL.pink, COL.pink, 'center');
    glowText('FINAL SCORE', W / 2, 230, 'bold 18px "Courier New", monospace', COL.purple, COL.purple, 'center');
    glowText(String(score), W / 2, 295, 'bold 64px "Courier New", monospace', COL.cyan, COL.cyan, 'center');
    if (newRecord) {
      const p = 0.6 + 0.4 * Math.sin(performance.now() / 150);
      ctx.save(); ctx.globalAlpha = p;
      glowText('★ NEW HIGH SCORE ★', W / 2, 340, 'bold 26px "Courier New", monospace', COL.yellow, COL.yellow, 'center');
      ctx.restore();
    } else {
      glowText('HIGH SCORE  ' + highScore, W / 2, 340, 'bold 20px "Courier New", monospace', COL.yellow, COL.yellow, 'center');
    }
    glowText('Survived ' + Math.floor(gameTime) + 's  -  Reached level ' + (level + 1), W / 2, 385, '16px "Courier New", monospace', COL.white, COL.cyan, 'center');
    if (stateTime > 0.6) {
      drawButton('PLAY AGAIN');
      glowText('or press ENTER / SPACE', W / 2, 536, '14px "Courier New", monospace', COL.purple, COL.purple, 'center');
    }
  }

  function render() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawBackground();

    if (state === STATE.START_MENU) {
      asteroids.forEach(drawAsteroid);
      drawMenu();
    } else {
      asteroids.forEach(drawAsteroid);
      drawBullets();
      if (state === STATE.PLAYING) drawShip();
      drawParticles();
      drawPopups();
      if (state === STATE.PLAYING) drawHUD();
      else { drawHUD(); drawGameOver(); }
    }
    ctx.restore();
  }

  // ---------- Main loop (fixed 60Hz timestep via rAF) ----------
  let last = performance.now();
  let acc = 0;
  const STEP = 1 / 60;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.25) dt = 0.25;
    acc += dt;
    while (acc >= STEP) {
      update(STEP);
      acc -= STEP;
    }
    render();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
